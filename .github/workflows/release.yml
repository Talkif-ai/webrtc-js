name: Release

# Publishes both packages to npm when a version tag (v*) is pushed.
# Auth: npm Trusted Publishing (OIDC) — each package on npmjs.com trusts this
# repo + workflow file; no token secret is involved. Provenance links each
# published version to the exact commit and workflow run that built it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Trusted Publishing (OIDC) needs npm CLI >= 11.5.1; Node 22 bundles 10.x.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm type-check
      # `pnpm pack` rewrites `workspace:^` peer deps to real semver; `npm publish`
      # of the tarball authenticates via OIDC (no registry-url/token in .npmrc).
      # Core first: the react package peer-depends on it.
      - run: pnpm pack && npm publish ./*.tgz --access public --provenance
        working-directory: packages/core
      - run: pnpm pack && npm publish ./*.tgz --access public --provenance
        working-directory: packages/react
